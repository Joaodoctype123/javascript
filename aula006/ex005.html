<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            background-color: bisque;
            font-family: Arial, Helvetica, sans-serif;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <script>
        var nome = window.prompt('Digite seu nome !')
        document.write(`Olá ${nome}, Seu nome tem ${nome.length} letras !<br>`) //.lenght: mostra o tanto de letras não é necessario ().
        document.write(`Seu nome em maiuscula é ${nome.toUpperCase()} ! <br>`) // para maiuscula e preciso do ${nome.toUpperCase()} dos parenteses dentro
        document.write(`Seu nome em minuscula é <strong>${nome.toLowerCase()}</strong>!`)
        // window.alert('A soma entre os numeros é ' + s) // com concatenação
        
    </script>
    
</body>
</html>
