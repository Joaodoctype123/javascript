<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Somando Números</title>
    <style>
        body {
            font: normal 18pt Arial;
            
            
        }
        input#txtn1 {
            font: normal 18pt Arial;
            width: 200px;
            border-radius: 10px;
            padding: 10px;
        }
        input#txtn2 {
            font: normal 18pt Arial;
            width: 200px;
            border-radius: 10px;
            padding: 10px;
        }
        input#txtn3 {
            font: normal 18pt Arial;
            width: 200px;
            border-radius: 10px;
            padding: 10px;
        }
        input#txtn4 {
            font: normal 18pt Arial;
            width: 200px;
            border-radius: 10px;
            padding: 10px;
        }
        .button-1 {
            font: normal 18pt Arial;
            width: 200px;
            border-radius: 10px;
            padding: 10px;
            background-color: blue;
            color: rgb(255, 255, 255);
        }
        .button-2 {
            font: normal 18pt Arial;
            width: 200px;
            border-radius: 10px;
            padding: 10px;
            background-color: blue;
            color: rgb(255, 255, 255); 
        }
        #calcu {
            text-align: center;
            margin: auto;
            border: black 2px;
            background-color: rgba(0, 0, 0, 0.253);
            width: 750px;
            border-style: solid;
            border-radius: 7px;
            height: 350px;
            box-shadow: 10px 10px 10px rgba(0, 0, 0, 0.479);

        }

    </style>
</head>
<body>
    <div id="calcu">
        <h1>Somando Valores</h1>
        <input type="number" name="txtn1" id="txtn1"> +
        <input type="number" name="txtn2" id="txtn2">
        <input type="button" value="Somar" onclick="somar()" class="button-1">
        <div id="res">
            Resultado:
        </div>
        <input type="number" name="txtn3" id="txtn3"> -
        <input type="number" name="txtn4" id="txtn4">
        <input type="button" value="Multiplicar" onclick="multiplicar()" class="button-2">
        <div id="resu">
            Resultado:
        </div>
       
    </div>
    <script>
        function somar() {
            var tn1 = window.document.getElementById('txtn1')
            var tn2 = window.document.getElementById('txtn2')
            var res = window.document.getElementById('res')
            var n1 = Number(tn1.value)
            var n2 = Number(tn2.value)
            var s = n1 + n2
            // var r = n1 + n2 - n3
            res.innerHTML = `A soma entre ${n1} e ${n2} é igual a ${s}`
            // res.innerHTML = `A soma entre ${n1} + ${n2} - ${n3} é igual a ${r}`

        }
        function multiplicar() {
            var tn3 = window.document.getElementById('txtn3')
            var tn4 = window.document.getElementById('txtn4')
            var resu = window.document.getElementById('resu')
            var n3 = Number(tn3.value)
            var n4 = Number(tn4.value) // vai dizer que 0 n4 é número e dizer que o tn4 tem um valor com o 'tn4.value'
            var r = n3 - n4 
            resu.innerHTML = `A subtração de ${n3} e ${n4} é igual a ${r}`
            
            
        }
    </script>
    
</body>
</html>
