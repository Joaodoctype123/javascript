<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estudos</title>
</head>
<body>
    <input type="number" name="num1" id="num1"> X
    <input type="number" name="num2" id="num2">
    <input type="button" value="MULTIPLICAR" onclick="multiplicar()">
    <div id="resu">
        <P>RESULTADO:</P>
    </div>
    <script>
        function multiplicar(){
            var numb1 = window.document.getElementById('num1')
            var numb2 = window.document.getElementById('num2')
            var resu = window.document.getElementById('resu')
            var num1 = Number(numb1.value)
            var num2 = Number(numb2.value)
            var res = num1 * num2
            resu.innerHTML = `O Resultado da conta entre ${num1} e ${num2} é igual a ${res}`
            
        }
    </script>
    
</body>
</html>
